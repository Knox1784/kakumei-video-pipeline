name: YouTube Auto Post

on:
  schedule:
    # JST → UTC (JST = UTC+9)。posting_schedule.yaml と同期させること。
    # 2026-06-01 運用方針: GHA schedule はベストエフォートで run ごとドロップし得る
    #   (6/1 に '0 13' / '0 14' が両方とも完全ドロップ = 投稿ゼロを観測)。対策として
    #   (1) :00 の最混雑帯を避けたオフピーク分、(2) 各スロット 3回の冗長発火 に変更。
    #   全試行が同時にドロップする確率を激減させる。
    # 二重投稿は dispatcher の already_posted_in_slot (posted_slot exact match) +
    #   queue dir 削除 + concurrency(group=auto-post) で防止 (先発が投稿+state push →
    #   後発は最新を checkout し "already posted within slot → skip")。
    # target_slot ゲートは引き続き有効 (各 clip を 22:00/23:00 に振り分け)。
    # --- 22:00 JST 枠 (= 13:xx UTC) を 3回試行 ---
    - cron: '11 13 * * *'   # 22:11 JST
    - cron: '31 13 * * *'   # 22:31 JST
    - cron: '51 13 * * *'   # 22:51 JST
    # --- 23:00 JST 枠 (= 14:xx UTC) を 3回試行 ---
    - cron: '11 14 * * *'   # 23:11 JST
    - cron: '31 14 * * *'   # 23:31 JST
    - cron: '51 14 * * *'   # 23:51 JST
  workflow_dispatch:        # 手動トリガー (テスト用)

concurrency:
  group: auto-post          # 二重起動防止

permissions:
  contents: write           # publishing-state を git push するため
  issues: write             # 失敗時に Issue 作成

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # クロスポスト暴走が 23:00 スロットを潰さないための上限
    # (デフォルト 6h だと concurrency group が次スロットの run をブロックし得る)
    # 予算概算: setup ~2 + YouTube ~6 + X 5 (300s) + Meta チェーン 12 (deadline 720s)
    #          + refresh ~0.5 + commit/report ~2 ≈ 27.5 min → 30 に設定。
    # ⚠️ timeout kill = state 未push = 次 cron で二重投稿。dispatcher 側の
    #    META_CHAIN_DEADLINE_S がこの上限内に収まるよう必ず同期させること
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # requests/requests-oauthlib は X クロスポスト用 (pin で夜間 resolve 事故を防止)
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 pyyaml 'requests>=2,<3' 'requests-oauthlib>=1.3,<3'

      - name: Install ffmpeg
        # x-uploader (720x1280 縮小) と meta-uploader (音声 preflight) が ffprobe/ffmpeg を使う。
        # ⚠️ ubuntu-latest ランナーに ffmpeg は入っていない (2026-06-06/07 の X 失敗の根本原因:
        #    FileNotFoundError: 'ffprobe')。apt で明示インストールする (~60s)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - name: Restore tokens from secrets
        # 命名規則: YT_TOKEN_<account_id_upper> → publishing/tokens/youtube/<account_id_lower>.json
        # 新アカ追加時は (1) GitHub Secret を YT_TOKEN_<NAME> で登録 (2) ここに env 行を追加
        env:
          YT_TOKEN_KAKUMEI_IKKA: ${{ secrets.YT_TOKEN_KAKUMEI_IKKA }}
        run: |
          mkdir -p publishing/tokens/youtube
          for var in $(env | grep -oE '^YT_TOKEN_[A-Z0-9_]+' | sort -u); do
            account=$(echo "${var#YT_TOKEN_}" | tr 'A-Z' 'a-z')
            value=$(printenv "$var" || true)
            if [ -z "$value" ]; then
              echo "⚠️  $var is empty, skipping"
              continue
            fi
            printf '%s' "$value" > "publishing/tokens/youtube/${account}.json"
            size=$(wc -c < "publishing/tokens/youtube/${account}.json")
            echo "✅ wrote publishing/tokens/youtube/${account}.json ($size bytes)"
            # Sanity: 健全な OAuth token JSON は通常 600-1200 bytes
            if [ "$size" -lt 400 ]; then
              echo "❌ $var の内容が短すぎ ($size bytes < 400)。Secret 登録時に全文がコピーされていない可能性。再登録が必要"
              exit 1
            fi
            # JSON valid + refresh_token 存在チェック
            python3 -c "import json,sys; d=json.load(open('publishing/tokens/youtube/${account}.json')); assert d.get('refresh_token'),'no refresh_token'" || { echo "❌ ${account}.json invalid"; exit 1; }
          done
          # 少なくとも1つ書けていることを確認
          test -n "$(ls publishing/tokens/youtube/*.json 2>/dev/null)" || (echo "❌ no tokens written"; exit 1)

      - name: Restore X tokens (best-effort)
        # 命名規則: X_TOKEN_<account_id_upper> → publishing/tokens/x/<account_id_lower>.json
        # ⚠️ YouTube の Restore とは独立ステップ。X 未セットアップ/secret 不正でも
        #    絶対に fail しない (exit 1 禁止) — YouTube フロー保護のため。
        #    secret 不正時は x_failure.json marker → "Report X failure" で Issue 化。
        continue-on-error: true
        env:
          X_TOKEN_KAKUMEI_IKKA: ${{ secrets.X_TOKEN_KAKUMEI_IKKA }}
        run: |
          mkdir -p publishing/tokens/x
          for var in $(env | grep -oE '^X_TOKEN_[A-Z0-9_]+' | sort -u); do
            account=$(echo "${var#X_TOKEN_}" | tr 'A-Z' 'a-z')
            value=$(printenv "$var" || true)
            if [ -z "$value" ]; then
              echo "ℹ️ $var is empty/unset → skip (X 未セットアップは正常)"
              continue
            fi
            printf '%s' "$value" > "publishing/tokens/x/${account}.json"
            # 4キー検証 — 欠落なら warning + marker (exit 1 はしない)
            if python3 -c "import json; d=json.load(open('publishing/tokens/x/${account}.json')); assert all(d.get(k) for k in ('api_key','api_key_secret','access_token','access_token_secret'))" 2>/dev/null; then
              echo "✅ wrote publishing/tokens/x/${account}.json"
            else
              echo "⚠️ ${account}.json malformed (4キー欠落) — X 投稿は skip されます。Secret 再登録が必要"
              printf '{"clip_id": null, "error": "X token malformed for %s (4キー欠落。gh secret set X_TOKEN_%s で再登録)", "at": "%s"}\n' "$account" "$(echo "$account" | tr 'a-z' 'A-Z')" "$(date -u +%FT%TZ)" > x_failure.json
              rm -f "publishing/tokens/x/${account}.json"
            fi
          done

      - name: Restore Meta tokens (best-effort)
        # 命名規則: META_TOKEN_<ID> → publishing/tokens/meta/<id>.json (App A: FB+IG・無期限 Page token)
        #          THREADS_TOKEN_<ID> → publishing/tokens/threads/<id>.json (App B: 60日 token)
        # ⚠️ X と同じく絶対に fail しない (exit 1 禁止) — YouTube/X フロー保護。
        #    secret 不正時は meta_failure.json の failures[] に追記 → "Report Meta failure" で Issue 化
        continue-on-error: true
        env:
          META_TOKEN_KAKUMEI_IKKA: ${{ secrets.META_TOKEN_KAKUMEI_IKKA }}
          THREADS_TOKEN_KAKUMEI_IKKA: ${{ secrets.THREADS_TOKEN_KAKUMEI_IKKA }}
        run: |
          mkdir -p publishing/tokens/meta publishing/tokens/threads
          append_marker() {
            MSG="$1" python3 -c '
          import json, os, datetime
          msg = os.environ["MSG"]
          doc = {"clip_id": None, "at": datetime.datetime.utcnow().isoformat() + "Z", "failures": []}
          if os.path.exists("meta_failure.json"):
              try:
                  doc = json.load(open("meta_failure.json")); doc.setdefault("failures", [])
              except Exception:
                  pass
          doc["failures"].append({"platform": "token_restore", "error": msg})
          json.dump(doc, open("meta_failure.json", "w"), ensure_ascii=False, indent=2)
          '
          }
          # --- App A (FB+IG) ---
          for var in $(env | grep -oE '^META_TOKEN_[A-Z0-9_]+' | sort -u); do
            account=$(echo "${var#META_TOKEN_}" | tr 'A-Z' 'a-z')
            value=$(printenv "$var" || true)
            if [ -z "$value" ]; then
              echo "ℹ️ $var is empty/unset → skip (Meta 未セットアップは正常)"
              continue
            fi
            printf '%s' "$value" > "publishing/tokens/meta/${account}.json"
            if python3 -c "import json; d=json.load(open('publishing/tokens/meta/${account}.json')); assert d.get('fb',{}).get('page_access_token')" 2>/dev/null; then
              echo "✅ wrote publishing/tokens/meta/${account}.json"
            else
              echo "⚠️ ${account}.json malformed (fb.page_access_token 欠落) — FB/IG 投稿は skip。Secret 再登録が必要"
              append_marker "META_TOKEN_$(echo "$account" | tr 'a-z' 'A-Z') malformed (gh secret set で再登録)"
              rm -f "publishing/tokens/meta/${account}.json"
            fi
          done
          # --- App B (Threads) ---
          for var in $(env | grep -oE '^THREADS_TOKEN_[A-Z0-9_]+' | sort -u); do
            account=$(echo "${var#THREADS_TOKEN_}" | tr 'A-Z' 'a-z')
            value=$(printenv "$var" || true)
            if [ -z "$value" ]; then
              echo "ℹ️ $var is empty/unset → skip (Threads 未セットアップは正常)"
              continue
            fi
            printf '%s' "$value" > "publishing/tokens/threads/${account}.json"
            if python3 -c "import json; d=json.load(open('publishing/tokens/threads/${account}.json')); assert d.get('access_token') and d.get('user_id')" 2>/dev/null; then
              echo "✅ wrote publishing/tokens/threads/${account}.json"
            else
              echo "⚠️ ${account}.json malformed (access_token/user_id 欠落) — Threads 投稿は skip。Secret 再登録が必要"
              append_marker "THREADS_TOKEN_$(echo "$account" | tr 'a-z' 'A-Z') malformed (gh secret set で再登録)"
              rm -f "publishing/tokens/threads/${account}.json"
            fi
          done

      - name: Refresh Threads tokens (best-effort)
        # threads トークンは 60日失効。refreshed_at が 7日超なら refresh → 新トークンを
        # Secret に書き戻し (GH_PAT_SECRETS = fine-grained PAT, このリポの Secrets: Read and write)。
        # ⚠️ Meta の refresh は旧トークンを失効させない → gh secret set が失敗しても
        #    Secret には有効な旧トークンが残り、次 run で丸ごとリトライされる (トークン喪失ウィンドウ無し)。
        #    この順序 (refresh 成功 → secret 書込み) を「最適化」で入れ替えないこと。
        # auto_post.yml 内に置く理由: この repo では GHA schedule 単独の週次 cron は信頼できない
        # (2026-06-01 に run 完全ドロップ実績)。auto_post は launchd 経由で毎日確実に発火する。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          shopt -s nullglob
          for f in publishing/tokens/threads/*.json; do
            python3 external_skills/meta-uploader/scripts/refresh_threads_token.py \
              --token "$f" --max-age-days 7 --update-gh-secret \
              || echo "⚠️ threads refresh failed for $f (marker 追記済・続行)"
          done

      - name: Dispatch queue
        id: dispatch
        shell: bash
        run: |
          set -o pipefail   # tee で exit code を握りつぶさない
          python3 publishing/scripts/dispatch_queue.py 2>&1 | tee dispatch.log

      - name: Commit state changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # tokens は .gitignore で除外済 (push されない)
          # 各 path 個別に add し、未存在/空でもエラーにしない
          git add publishing/queue 2>/dev/null || true
          git add publishing/publishing-state 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no changes (no-op tick)"
          else
            git commit -m "auto-post: dispatch queue $(date -u +%FT%TZ)"
            # ⚠️ push 失敗 = state 未反映 = 次 cron で二重投稿 (全プラットフォーム)。
            #    run 中に人間が queue を push した場合に備え rebase + 3回リトライで確実に乗せる。
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "⚠️ push 失敗 (attempt $i/3) — 5秒後リトライ"
              sleep 5
              [ "$i" = "3" ] && { echo "❌ push 3回失敗 — state 未反映 (二重投稿リスク)"; exit 1; }
            done
          fi

      - name: Report X failure
        # x_failure.json は「YouTube は成功したが X 投稿に失敗した」時のみ存在する。
        # dispatch は X 失敗でも exit 0 (= job success) のため if: failure() では絶対に
        # 発火しない。always() + ファイル存在チェックで判定する。
        # サーキットブレーカー: open Issue (label: auto-post-failure-x) が既にあれば
        # comment 追記 (連続失敗で Issue が毎スロット増殖するのを防ぐ)。
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('x_failure.json')) return;
            let detail = '(unreadable)';
            try { detail = fs.readFileSync('x_failure.json', 'utf8'); } catch (e) {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Workflow run: ${runUrl}`,
              '',
              'YouTube 投稿は成功・X クロスポストのみ失敗 (自動リトライ無し — queue は消化済み)。',
              '対応手順: publishing/AUTO_POST_RULES.md の「X 投稿が止まった時」参照。',
              '',
              '```json',
              detail.slice(0, 3000),
              '```',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'auto-post-failure-x', state: 'open', per_page: 1,
            });
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `X 投稿が再び失敗 (${new Date().toISOString()})\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '❌ X (Twitter) クロスポスト失敗 — auto-post',
                body,
                labels: ['auto-post-failure-x'],
              });
            }

      - name: Report Meta failure
        # meta_failure.json は「YouTube は成功したが Meta (FB/IG/Threads) のどれかが失敗」
        # または token restore/refresh の失敗時のみ存在する。X と同じく if: failure() では
        # 発火しないため always() + ファイル存在チェック。failures[] 配列を platform 毎に表示。
        # サーキットブレーカー: open Issue (label: auto-post-failure-meta) があれば comment 追記。
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('meta_failure.json')) return;
            let doc = {};
            try { doc = JSON.parse(fs.readFileSync('meta_failure.json', 'utf8')); } catch (e) {}
            // 防御的スクラブ (最終出口): producer 側でもスクラブ済みだが、Issue は public のため
            // 将来の未スクラブ経路への保険として token らしき文字列をここでも置換する
            const scrub = (s) => String(s)
              .replace(/access_token=[^&\s"']+/g, '***TOKEN***')
              .replace(/\bEAA[0-9A-Za-z]{20,}/g, '***TOKEN***')
              .replace(/\bTH[A-Z][0-9A-Za-z_\-]{20,}/g, '***TOKEN***')
              .replace(/\bIGQ[0-9A-Za-z_\-]{20,}/g, '***TOKEN***');
            const failures = doc.failures || [];
            const lines = failures.map(f =>
              `- **${f.platform}** (clip: ${f.clip_id || doc.clip_id || '?'}): ${scrub(f.error).slice(0, 500)}`
            ).join('\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Workflow run: ${runUrl}`,
              '',
              'YouTube / X は影響なし・Meta クロスポストのみ失敗 (自動リトライ無し — queue は消化済み)。',
              '対応手順: publishing/AUTO_POST_RULES.md の「Meta 投稿が止まった時」参照。',
              '',
              '## 失敗内訳',
              lines || '(詳細なし)',
              '',
              '<details><summary>raw marker</summary>',
              '',
              '```json',
              scrub(JSON.stringify(doc, null, 2)).slice(0, 3000),
              '```',
              '</details>',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'auto-post-failure-meta', state: 'open', per_page: 1,
            });
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Meta 投稿が再び失敗 (${new Date().toISOString()})\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '❌ Meta (FB/IG/Threads) クロスポスト失敗 — auto-post',
                body,
                labels: ['auto-post-failure-meta'],
              });
            }

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '(no log file)';
            try { log = fs.readFileSync('dispatch.log', 'utf8'); } catch (e) {}
            const body = [
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              log.slice(-4000),
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Auto-post failed at ${new Date().toISOString()}`,
              body,
              labels: ['auto-post-failure'],
            });
