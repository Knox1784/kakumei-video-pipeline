# =============================================================================
# YouTube アカウント台帳
# =============================================================================
# 1つのGmailに複数YouTubeブランドチャンネルをぶら下げ可能
# 新規追加時の手順:
#   1) Gmail新規作成 (or既存利用)
#   2) YouTubeでブランドチャンネル作成
#   3) Cloud Consoleでテストユーザー登録 (tokumasasns@gmail.com 等)
#      → console.cloud.google.com → youtube-100-account-managing
#      → APIs & Services → OAuth consent screen → Test users → ADD USERS
#   4) python3 ~/.claude/skills/youtube-uploader/scripts/upload.py \
#        --authorize --token publishing/tokens/youtube/{id}.json
#   5) ブラウザで該当Gmailログイン→ブランドチャンネル選択→承認
#   6) このファイルに1エントリ追記
# =============================================================================

