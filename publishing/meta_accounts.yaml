# =============================================================================
# Meta (Facebook Page / Instagram / Threads) アカウント台帳
# =============================================================================
# ⚠️ ポリシー大原則:
#   🚫 各プラットフォーム1アカのみ (FB Page / IG / Threads 各1)。複数アカへの
#      同一/類似コンテンツ自動投稿は CIB (Coordinated Inauthentic Behavior) として
#      **ネットワーク一括BAN** (X と同じ原則)。100アカ構想は Meta に持ち込まない。
#   ✅ 自ブランドの FB+IG+Threads 同一コンテンツ展開は公式に明示許可
#      (2025-07 Meta ポリシー: 罰則対象は「他人の」コンテンツ転載のみ)。
#   ✅ 自社ロゴ焼き込み OK。⚠️ YouTube から再DLした動画は使わない (ローカルマスター必須)。
#
# 新規追加時の手順 (詳細は publishing/SETUP_META.md):
#   1) FB Page 作成 → IG をプロアカ化して Page に連携 → Threads アカ作成
#   2) App A 作成 (Business type / use case "Other") — FB+IG 用
#   3) App B 作成 ("Access the Threads API" use case) — Threads 用
#      (⚠️ App A に同居不可: Facebook Login use case と非互換・use case は削除不可)
#   4) python3 external_skills/meta-uploader/scripts/authorize.py --account-id <id>
#   5) upload.py --verify --platform {facebook,instagram,threads} で3つとも確認
#   6) gh secret set META_TOKEN_<ID> < publishing/tokens/meta/<id>.json
#      gh secret set THREADS_TOKEN_<ID> < publishing/tokens/threads/<id>.json
#   7) .github/workflows/auto_post.yml の Restore Meta tokens に env 2行追加
#   8) このファイルに1エントリ追記
# =============================================================================

# 課金: Meta の投稿 API は無料 (X と違い pay-per-use 無し)
billing: free

accounts:
  - id: kakumei_ikka
    meta_token_file: tokens/meta/kakumei_ikka.json        # App A: FB+IG (FB ログイン経路)
    threads_token_file: tokens/threads/kakumei_ikka.json  # App B: Threads (本番稼働中)
    fb_page: { id: "1156587220871899", name: "ファン 匠瞬一家の切り抜き" }
    instagram: { ig_user_id: "17841413654471535", handle: "@shoma_ikka", url: "https://www.instagram.com/shoma_ikka/" }
    threads: { user_id: "27052129904451711", handle: "@shoma_ikka", url: "https://www.threads.com/@shoma_ikka" }
    app_a: "2860281884307669"   # Business・use case「ページのすべてを管理」+「Instagramでメッセージとコンテンツを管理」。審査不要
    app_b: "995590946777212"    # Threads use case (Threads App ID。Basic Settings の App ID とは別物)。redirect = https://oauth.pstmn.io/v1/callback
    gha_secrets: [META_TOKEN_KAKUMEI_IKKA, THREADS_TOKEN_KAKUMEI_IKKA]
    pat_secret: "なし (ユーザー選択で PAT 不使用)"   # ⚠️ FB+IG は元々不要。Threads も PAT 無し運用 (下記)
    authorized_at: 2026-06-08
    scopes: [pages_show_list, pages_read_engagement, pages_manage_posts, read_insights,
             instagram_basic, instagram_content_publish, instagram_manage_insights, business_management]
    threads_scopes: [threads_basic, threads_content_publish, threads_manage_insights]
    notes: |
      ★ トークン設計 (FB ログイン経路・FB+IG を Page トークン1本で投稿):
        token JSON は **user_access_token (無期限)** を master 鍵として保管。FB/IG 投稿に使う
        fb.page_access_token は未公開アプリだと60日失効するが、auto_post.yml が毎 run
        refresh_meta_token.py で「無期限ユーザートークン → Page トークン」をその場で再生成する。
        → **app secret も PAT も再OAuth も不要。ユーザー作業ゼロで永久に動く**。
        データアクセス90日失効は毎晩の投稿(=使用)で更新され続けるため発動しない。
      ★ 投稿+分析+コメント権限を banking 済 (read_insights / instagram_manage_insights):
        後で「Meta版 post-monitor」(リーチ/視聴維持/エンゲージメント収集) を OAuth やり直さず構築可能。
      ⚠️ 失効トリガ (無期限ユーザートークンが死ぬ稀ケース): FB パスワード変更 / 2FA 変更 /
        セキュリティチェックポイント / アプリ連携解除。その時のみ Graph API Explorer で
        ユーザートークン再取得 → fb_exchange_token で無期限化 → gh secret set META_TOKEN_KAKUMEI_IKKA。
        refresh が IG 連携断を検知したら Issue (auto-post-failure-meta) で通知。
      ⚠️ IG はキャプションの API 編集・API 削除ともに不可 (IG アプリから手動)。
      ★ Threads (App B) のトークン運用 = **PAT 無し方式** (ユーザー選択):
        Threads は60日トークンが上限 (無期限不可)。PAT を作らない方針のため、GHA の
        「Refresh Threads tokens」ステップは PAT 未設定を検知して自動更新をスキップし、
        失効12日前になったら Issue (auto-post-failure-meta) でリマインドする。
        実際の更新は **Mac のローカル gh** で手動実行 (ローカル gh は Secret 書込み権限あり):
          python3 external_skills/meta-uploader/scripts/refresh_threads_token.py \
            --token publishing/tokens/threads/kakumei_ikka.json --force --update-gh-secret
        → 60日延長 + Secret 書き戻し (再OAuth 不要)。月1回 Claude に「Threads更新して」で済む。
        万一60日を超えて完全失効したら、SETUP_META の Threads OAuth (redirect=oauth.pstmn.io) を
        やり直す (App B の redirect callback URL は登録済なので URL を開いて code を貼るだけ)。
      ⚠️ Threads の動画は repo public 前提 (raw.githubusercontent の SHA固定 URL を Meta が fetch。
        2026-06-08 実機で octet-stream content-type でも取得成功を確認済 = Pages フォールバック不要)。
