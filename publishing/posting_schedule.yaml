# YouTube 自動投稿スロット定義
#
# このファイルが投稿時刻の Single Source of Truth。
# スロットを変更したら .github/workflows/auto_post.yml の cron 行も同期更新すること。
# (Phase 100 で auto-sync スクリプト化予定)
#
# 採用根拠 (2026-05-03 リサーチ + 2026-05-06 自社データ):
#   日本市場の YouTube Shorts ゴールデンタイム = 12:00 / 19:00 / 21:00 が定番
#   + 朝 07:30 (通勤・登校時) を追加して4スロット運用 (初期)
#   + 自社データで 21:46 / 21:55 投稿が圧勝 (1100 / 4370 views/日) → 22:00 / 23:00 拡張 (2026-05-07)

timezone: Asia/Tokyo
# 2026-05-17 復元: 6 slot 体制。 各 clip は meta.json の target_slot で
# 個別に「希望スロット」を指定する設計 (dispatcher が exact match で消化)。
# target_slot 未指定なら従来通り (任意 slot で消化)。
slots:
  - "07:30"   # モーニング: 通勤・登校時のスマホピーク
  - "12:00"   # ランチ: 休憩中の最頻ピーク
  - "19:00"   # 帰宅後: 平日リラックス時間
  - "21:00"   # 夜メイン1: 曜日横断の最強ピーク
  - "22:00"   # 夜メイン2: 21時の余熱・寝る前1stチェック
  - "23:00"   # 夜遅: 寝落ち前の最後の一本

# GHA cron の遅延を吸収するための時刻幅 (分)
# 例: 12:00 スロットなら 11:00〜13:00 までを有効と判定
# GHA schedule はベストエフォートで数十分〜1時間以上遅延しうるため広めに取る (実測 45分遅延を観測 2026-05-04)
slot_window_min: 60

# キュー消化戦略
# fifo: ディレクトリ名昇順で先頭から1本ずつ
queue_strategy: fifo
