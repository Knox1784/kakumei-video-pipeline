# YouTube 自動投稿スロット定義
#
# このファイルが投稿時刻の Single Source of Truth。
# スロットを変更したら .github/workflows/auto_post.yml の cron 行も同期更新すること。
# (Phase 100 で auto-sync スクリプト化予定)
#
# 採用根拠 (2026-05-03 リサーチ):
#   日本市場の YouTube Shorts ゴールデンタイム = 12:00 / 19:00 / 21:00 が定番
#   + 朝 07:30 (通勤・登校時) を追加して4スロット運用

timezone: Asia/Tokyo
slots:
  - "07:30"   # モーニング: 通勤・登校時のスマホピーク
  - "12:00"   # ランチ: 休憩中の最頻ピーク
  - "19:00"   # 帰宅後: 平日リラックス時間
  - "19:55"   # 【一時テスト用 2026-05-04 schedule 動作確認】テスト後に削除予定
  - "21:00"   # 夜メイン: 曜日横断の最強ピーク

# GHA cron の遅延を吸収するための時刻幅 (分)
# 【一時的に 10 に短縮 — 19:00 投稿が 19:55 window に被るのを防ぐため】
# テスト後 60 に戻す
slot_window_min: 10

# キュー消化戦略
# fifo: ディレクトリ名昇順で先頭から1本ずつ
queue_strategy: fifo
